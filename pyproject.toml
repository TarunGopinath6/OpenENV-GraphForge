[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "graphforge"
version = "1.0.0"
description = "OpenENV environment for RL-driven Python module graph construction"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "BSD-3-Clause"}
authors = [
    {name = "fin1solutions"}
]
keywords = ["reinforcement-learning", "graph", "code-generation", "openenv", "long-horizon-planning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD Software License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.0.0",
    "httpx>=0.25.0",
    "openenv-core>=0.2.0",
    "websockets>=12.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.23.0",
    "mypy>=1.8.0",
    "hypothesis>=6.100.0",
]
training = [
    "torch>=2.2.0",
    "transformers>=4.40.0",
    "trl>=0.8.0",
    "accelerate>=0.30.0",
    "datasets>=2.18.0",
    "wandb>=0.16.0",
    "peft>=0.10.0",
]

[project.scripts]
graphforge-server = "server.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["server*", "tasks*", "baseline*", "examples*", "engine*", "client*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
